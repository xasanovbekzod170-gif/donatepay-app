<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Donate Pay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c1a;--card:#12152a;--card2:#1a1e3a;--line:#262b4f;--tx:#f1f3ff;--mut:#8e94bd;--ac:#8b7bff;--pr:#5fd7ff;--rd:#e11d48;--ok:#2cd98a;--warn:#ffb020;--r:22px;--glow:#6c5cff33}
:root[data-theme=light]{--bg:#f3f4fc;--card:#fff;--card2:#eaecfa;--line:#dcdff2;--tx:#14172e;--mut:#6b7099;--ac:#5b4bf0;--pr:#1478d4;--glow:#6c5cff18}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}body{background:var(--bg);color:var(--tx);font:500 15px/1.4 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 340px at 100% -5%,var(--glow),transparent),radial-gradient(420px 320px at -10% 105%,var(--glow),transparent)}
h1,h2,h3,.num,.price,.btn,.brand,.pk b,.gc b{font-family:Manrope,Manrope,sans-serif}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#hd{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#hbrand,#hback{display:flex;align-items:center;gap:12px;flex:1;min-width:0}#hback{display:none}
.logo{width:46px;height:46px;border-radius:14px;overflow:hidden;box-shadow:0 8px 22px -8px #2e8bff}.logo img{display:block;width:100%;height:100%;object-fit:cover}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);transition:opacity .35s ease,visibility .35s}#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 18px 50px -12px #2e8bff;animation:spl 1.6s ease-in-out infinite}
#splash b{font-size:15px;font-weight:700;color:var(--mut);letter-spacing:.2px}
#splash .sb{width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}#splash .sb:after{content:"";display:block;width:45%;height:100%;border-radius:4px;background:linear-gradient(90deg,#5fd7ff,#2e8bff);animation:splb 1.1s ease-in-out infinite}
@keyframes spl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes splb{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.brand{font-size:20px;font-weight:800;display:block;line-height:1.1}.brand i{font-style:normal;color:var(--ac)}
#hbrand small{color:var(--mut);font-size:12px}
.ib.lg{font:800 13px Manrope,system-ui,sans-serif;letter-spacing:.3px}.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.bk{width:44px;height:44px;border:0;background:none;color:var(--tx);cursor:pointer;display:grid;place-items:center}
#ht{font-size:19px;font-weight:700;line-height:1.15}
.scr{display:none;padding:18px 16px 120px}.scr.on{display:block}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:19px;font-weight:700;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font:700 14px Manrope,system-ui,sans-serif;color:var(--ac);cursor:pointer}
.mut{color:var(--mut)}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#8b6bff,#2e8bff);cursor:pointer;transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.w{width:100%}.btn.wh{background:#fff;color:#1a120c;padding:12px 18px}.btn.ok{background:linear-gradient(90deg,#1fc77a,#2cd98a);color:#04170e}
.btn.gh{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.cta{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px;border-radius:22px;cursor:pointer;color:#fff;background:linear-gradient(90deg,#6c5cff,#e11d48);box-shadow:0 16px 32px -16px #6c5cff}
.cta .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ffffff2e}
.cta b{display:block;font:700 17px Manrope,system-ui,sans-serif}.cta small{opacity:.9;font-size:13px}.cta>svg{margin-left:auto}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-top:10px;cursor:pointer}
.ic2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--ac);flex:none}
.row b{display:block;font:700 16px Manrope,system-ui,sans-serif}.row small{color:var(--mut);font-size:13px}.row>svg{margin-left:auto;color:var(--mut)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.gc{flex:0 0 auto;width:158px;min-width:0;display:flex;flex-direction:column;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .15s}.gc:active{transform:scale(.97)}
.gi{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:linear-gradient(135deg,var(--g1),var(--g2)) center/cover}
.gc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin-top:12px;min-height:2.4em;font-size:16px;font-weight:700;line-height:1.2}.gc small{display:block;color:var(--mut);font-size:13px;margin-top:2px;margin-bottom:12px}
.mn{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}.mn .ft{display:flex;align-items:center;gap:5px;font-weight:600}.mn .ft svg{width:14px;height:14px;stroke-width:2.2;color:var(--ac)}.mn em{display:block;font:700 14px Manrope,system-ui,sans-serif;color:var(--pr);margin-bottom:3px;font-style:normal}
.gg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px;margin-top:16px}.gg .gc{width:auto}
.fl{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}
.fl button{flex:none;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.fl button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.gc{position:relative}.gc .nw{position:absolute;top:12px;right:12px;padding:3px 8px;border-radius:99px;background:var(--ac);color:#fff;font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.6px}
.srch{width:100%;margin-top:16px;padding:15px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 15px Manrope,system-ui,sans-serif;outline:none}
.srch:focus,input.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px #6c5cff2e}
.top{display:flex;align-items:center;gap:14px}.top .gi{width:74px;height:74px;border-radius:20px;font-size:34px}.top h1{font-size:25px}
.tag{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 11px;border-radius:99px;background:#6c5cff22;color:var(--ac);font-size:12.5px;font-weight:700}
.box{padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-top:14px}
label{display:block;color:var(--mut);font-size:13px;font-weight:600;margin:10px 0 6px}
input.in{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:700 17px Manrope,system-ui,sans-serif;outline:none}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{position:relative;min-height:92px;padding:16px 10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s;text-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.pk small{color:var(--mut);font-size:13px;margin-top:-6px}.pk.na{opacity:.6}.pk.na span{color:var(--mut)}.gi{overflow:hidden}
.vq{grid-column:1/-1;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.vq label{margin-top:0}.vq .vqh{font-size:12.5px;margin-top:8px}.vq .vqh.bad{color:var(--rd)}.vq .chips{margin-top:12px}
.vq .vqt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-weight:600}.vq .vqt b{font-size:20px;color:var(--pr);font-weight:800}
.pk:active{transform:scale(.97)}.pk b{font-size:20px;font-weight:800;line-height:1.15;color:var(--tx)}.pk span{color:var(--pr);font-weight:700;font-size:14px}
.pk.sel{border-color:var(--ac);background:linear-gradient(160deg,#6c5cff26,#35b8ff14);box-shadow:0 0 0 1px var(--ac),0 12px 28px -14px #6c5cff}
.pk.sel:after{content:"✓";position:absolute;right:11px;top:8px;color:var(--ac);font-weight:800}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(0deg,var(--bg) 86%,#0000);display:none}.bar.on{display:block}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;color:var(--mut)}.sum b{color:var(--tx);font:800 22px Manrope,system-ui,sans-serif}
.nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;display:none;justify-content:space-around;padding:9px 8px;border-radius:26px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 14px 34px -12px #000a}.nav.on{display:flex}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:700 11px Manrope,system-ui,sans-serif;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.on{color:var(--ac)}
.seg{display:flex;gap:4px;padding:5px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-top:16px}
.seg button{flex:1;padding:13px;border:0;border-radius:14px;background:none;color:var(--mut);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}.seg button.on{background:var(--card2);color:var(--tx)}
.it{display:flex;justify-content:space-between;gap:10px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-top:10px}
.it b{font-size:15px;display:block}.it small{color:var(--mut);font-size:12px}.it .r{text-align:right}
.st{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.s-done{background:#2cd98a22;color:var(--ok)}.s-wait{background:#ffb02022;color:var(--warn)}.s-bad{background:#e11d4824;color:#ff4d6d}
.plus{color:var(--ok)}
.av{width:88px;height:88px;margin:6px auto 12px;border-radius:50%;display:grid;place-items:center;font:800 36px Manrope,system-ui,sans-serif;color:var(--ac);background:var(--card2);border:1px solid var(--line)}
.cp{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer}
.ccard .cp{border-color:#ffffff66;background:#ffffff26;color:#fff}
.ccard{padding:22px;border-radius:26px 26px 26px 8px;color:#fff;background:linear-gradient(135deg,#7a5cff,#2e8bff);box-shadow:0 20px 40px -18px #6c5cff;margin-top:14px}
.ccard .num{font-size:24px;letter-spacing:2px;margin:14px 0;font-weight:700}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font:800 30px Manrope,system-ui,sans-serif;color:var(--pr)}
.lst{margin-top:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:17px 16px;cursor:pointer;font:700 16px Manrope,system-ui,sans-serif}.li+.li{border-top:1px solid var(--line)}.li svg:first-child{color:var(--ac)}.li svg:last-child{margin-left:auto;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-end}.ov.on{display:flex}
.sh{width:100%;max-height:88vh;overflow:auto;padding:20px 16px calc(env(safe-area-inset-bottom) + 18px);border-radius:28px 28px 0 0;background:var(--bg);border-top:1px solid var(--line);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pm{display:flex;align-items:center;gap:12px;padding:15px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-top:10px;cursor:pointer}
.pm.dis{opacity:.45}.pm i{font-style:normal;font-size:24px}.pm small{color:var(--mut);display:block}.pm .ch{margin-left:auto;color:var(--ac)}
.ok-ic{width:92px;height:92px;margin:50px auto 16px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#04170e;background:linear-gradient(135deg,var(--ok),#1fc77a);box-shadow:0 0 50px -8px var(--ok);animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sk{height:150px;border-radius:24px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 12px);z-index:30;padding:13px 16px;border-radius:16px;background:var(--rd);color:#fff;font-weight:700;transform:translateY(-150%);transition:.3s}.toast.on{transform:none}
.center{text-align:center}.emp{text-align:center;color:var(--mut);padding:40px 0}
/* ===== HOME: greeting, banners, quick actions ===== */
.gr{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:0 14px 28px -20px #6c5cff}
#home{padding-top:14px}
.gav{width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;flex:none;display:grid;place-items:center;font:800 19px Manrope,system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#8b7bff,#2e8bff);box-shadow:0 0 0 2px var(--card),0 0 0 4px #8b7bff66}
.gt{min-width:0;flex:1;line-height:1.2}.gt small{display:block;color:var(--mut);font-size:13px}.gt b{display:block;font:800 18px Manrope,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bchip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 72%,var(--card));color:var(--tx);font:800 14px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 22px -14px #6c5cff}
.bchip>svg{width:18px;height:18px;color:var(--ac)}.bchip em{font-style:normal;color:var(--mut);font-weight:600;font-size:12px}
.bchip .pl{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#8b7bff,#2e8bff)}.bchip .pl svg{width:15px;height:15px;stroke-width:2.6}
.bchip:active{transform:scale(.96)}

.bnw{margin:16px -16px 0}
.bnt{display:flex;gap:16px;overflow-x:auto;padding:4px 16px 24px;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.bnt::-webkit-scrollbar{display:none}
@media(prefers-reduced-motion:reduce){.bn.act .bn-ico,.bn.act .bn-glass,.bn.act .bn-tag:before{animation:none}}
.bn{position:relative;flex:0 0 100%;min-width:0;height:168px;scroll-snap-align:center;scroll-snap-stop:always;border-radius:28px;overflow:hidden;cursor:pointer;color:#fff;isolation:isolate;display:flex;align-items:center;padding:16px 14px 16px 18px;background:linear-gradient(135deg,var(--c1,#6c5cff),var(--c2,#2e8bff));box-shadow:0 14px 20px -14px var(--c1,#6c5cff),inset 0 1px 1px #ffffff55;border:1px solid #ffffff26}
.bn-bg{position:absolute;inset:0;z-index:-3;background:center/cover no-repeat}
.bn-fx{position:absolute;inset:0;z-index:-2;background:linear-gradient(100deg,#0a0c1ae6 0%,#0a0c1a99 42%,#0a0c1a1a 100%)}
.bn.p .bn-fx{background:radial-gradient(140px 140px at 88% 18%,#ffffff40,transparent 70%),radial-gradient(180px 180px at 8% 120%,#00000047,transparent 70%),repeating-linear-gradient(45deg,#ffffff0d 0 1px,transparent 1px 16px)}
.bn:after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,#ffffff2e,#fff0 38%);pointer-events:none}
.bn-tx{position:relative;flex:1;min-width:0;padding-right:92px;z-index:2}
.bn-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:#ffffff3d;border:1px solid #ffffff4d;font:800 10.5px Manrope,system-ui,sans-serif;letter-spacing:.9px}
.bn-tag:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}.bn.act .bn-tag:before{animation:bnp 1.6s infinite}
@keyframes bnp{50%{opacity:.35}}
.bn h3{font:800 19px/1.15 Manrope,system-ui,sans-serif;margin:9px 0 5px;letter-spacing:-.3px;text-shadow:0 2px 14px #0006;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bn p{font-size:12.5px;line-height:1.3;color:#ffffffd9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bn-btn{margin-top:10px;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 8px 0 15px;border:0;border-radius:99px;background:#fff;color:#161233;font:800 13px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 22px -10px #000a}
.bn-btn svg{width:17px;height:17px;stroke-width:2.6}.bn-btn:active{transform:scale(.95)}
.bn-art{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:1;width:84px;height:84px;display:grid;place-items:center}
.bn-ico{width:84px;height:84px;border-radius:24px;background:center/cover no-repeat,#1a1e3a;border:2px solid #ffffff66;box-shadow:0 22px 34px -14px #000c,0 0 0 6px #ffffff14;transform:rotate(-7deg)}.bn.act .bn-ico,.bn.act .bn-glass{animation:flt 4.4s ease-in-out infinite}
.bn-glass{width:80px;height:80px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff66,#ffffff26);border:1px solid #ffffff66;box-shadow:inset 0 2px 2px #ffffff99,0 22px 30px -14px #0007;transform:rotate(7deg)}
.bn-glass svg{width:38px;height:38px;stroke-width:1.7;filter:drop-shadow(0 4px 10px #0005)}
@keyframes flt{50%{translate:0 -7px}}
.bn-ring{position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;border:26px solid #ffffff12;z-index:-1}
/* Yangilik banneri: oq "YANGILIK" belgisi, qizil nuqta, doira ikonka */
.bn.nw .bn-fx{background:radial-gradient(150px 120px at 92% 8%,#ffffff33,transparent 70%),repeating-linear-gradient(0deg,#ffffff0a 0 1px,transparent 1px 7px)}
.bn.nw .bn-tag{background:#fff;color:#1b1450;border-color:#fff}
.bn.nw .bn-tag:before{background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.bn.nw .bn-glass{border-radius:50%}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-10px}
.dots i{position:relative;width:6px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;transition:width .35s cubic-bezier(.22,1,.36,1),background .3s;cursor:pointer}
.dots i.on{width:26px;background:color-mix(in srgb,var(--ac) 30%,var(--line))}
.dots i.on:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#8b7bff,#35b8ff);transform-origin:left;animation:bnf var(--bd,5s) linear forwards}
@keyframes bnf{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bn.sk2{background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;border-color:var(--line);box-shadow:none}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}

@media(hover:hover){
  .gc:hover{transform:translateY(-4px);border-color:var(--ac)}
  .pk:hover,.row:hover,.pm:hover{border-color:var(--ac)}
  .btn:hover,.cta:hover{filter:brightness(1.08)}
  .qa button:hover{border-color:var(--ac)}
}

/* Savat: paket kartasida − n + */
.pk .ctr{display:flex;align-items:center;justify-content:flex-end;min-height:34px;margin:2px -2px -4px}
.pk .ctc{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.pk .ctc button{width:38px;height:34px;border-radius:12px;border:0;padding:0;font:800 20px/1 Manrope,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
.pk .ctc .ctm{background:color-mix(in srgb,var(--tx) 10%,transparent);color:var(--tx)}
.pk .ctc .ctp{background:var(--grad);color:#fff}
.pk .ctc em{font:800 17px Manrope,system-ui,sans-serif;font-style:normal;color:var(--tx);min-width:22px;text-align:center}
.pk .ctc button:active{transform:scale(.92)}

/* Aksiya kartasi */
.sale{display:none;flex-direction:column;align-items:stretch;gap:8px;margin-top:14px;padding:16px;border-radius:24px;position:relative;overflow:hidden;cursor:pointer;color:#fff;
 background:linear-gradient(125deg,#ff7a18 0%,#ff3d5a 55%,#c026d3 100%);box-shadow:0 18px 36px -18px #ff3d5acc,inset 0 1px 0 #ffffff55;isolation:isolate}
.sale:before{content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#ffffff40,#fff0 70%);z-index:-1}
.sale:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff0d 0 12px,#fff0 12px 24px);z-index:-1}
.sale .sl-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sale .sl-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.sale .sl-ttl{display:none}
.sale .sl-tag{align-self:flex-start;padding:4px 10px;border-radius:99px;background:#00000030;font:800 12px Manrope,system-ui,sans-serif;letter-spacing:.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sale .sl-p{font:900 44px/1.05 Manrope,system-ui,sans-serif;letter-spacing:-1.5px;text-shadow:0 4px 18px #0004}
.sale small{color:#ffffffd9;font:700 12px Manrope,system-ui,sans-serif}
.sale .sl-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;flex:none}
.sale .sl-t{display:flex;gap:5px}
.sale .tb{display:flex;flex-direction:column;align-items:center;min-width:42px;padding:7px 4px 5px;border-radius:12px;background:#0000003d;box-shadow:inset 0 1px 0 #ffffff26}
.sale .tb b{font:800 20px/1 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.sale .tb small{font-size:10px;margin-top:3px;opacity:.85}
.sale.mini{padding:10px 14px;border-radius:20px;margin:12px 0 4px}
.sale.mini .sl-tag{display:none}.sale.mini .sl-sub{display:none}.sale.mini .sl-ttl{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sale.mini .sl-p{font-size:26px;letter-spacing:-.8px}
.sale.mini .tb{min-width:34px;padding:5px 3px 4px;border-radius:10px}.sale.mini .tb b{font-size:15px}.sale.mini .tb small{font-size:9px;margin-top:2px}
.sale.mini .sl-r>small{display:none}
@media(max-width:360px){.sale .sl-p{font-size:36px}.sale .tb{min-width:36px}.sale .tb b{font-size:17px}}
.gc.onsale .mn em{font-size:11.5px;line-height:1.35;background:none;-webkit-background-clip:initial;background-clip:initial;color:#ff6a3d;font-weight:800}
.gc .mn s,.bn-tx p s{color:var(--mut);font-weight:600;opacity:.8}
.pk span .pold{display:block;margin:0 0 1px;font-size:12px;line-height:1.2}
/* ===== Bosh sahifa: shaxsiy karta (Qayta xarid / Boshlash) va "Qanday ishlaydi" ===== */
.hero{display:none;position:relative;overflow:hidden;margin-top:14px;padding:14px;border-radius:24px;cursor:pointer;border:1px solid color-mix(in srgb,var(--ac) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 24%,var(--card)),color-mix(in srgb,var(--pr) 10%,var(--card)));box-shadow:inset 0 1px 0 var(--hi),var(--sh);transition:transform .15s}
.hero:active{transform:scale(.98)}
.hero:before{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#8b7bff38,#8b7bff00 70%);pointer-events:none}
.hero .hr{position:relative;display:flex;align-items:center;gap:13px}
.hero .hi{flex:none;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,var(--g1),var(--g2)) center/cover;box-shadow:0 10px 20px -10px #000a,inset 0 0 0 1px #ffffff26}
.hero .stk{flex:none;display:flex;padding-left:14px}
.hero .stk i{width:46px;height:46px;margin-left:-14px;border-radius:15px;display:grid;place-items:center;font-size:21px;font-style:normal;border:2px solid var(--card);background:linear-gradient(135deg,var(--g1),var(--g2)) center/cover;box-shadow:0 8px 16px -8px #000a}
.hero .ht{min-width:0;flex:1}
.hero .tg{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--grad);color:#fff;font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.6px}
.hero .ht b{display:block;margin-top:6px;font:800 16px/1.2 Manrope,system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .ht small{display:block;margin-top:3px;color:var(--mut);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .ht small.wr{white-space:normal;line-height:1.35}
.hero .btn{position:relative;width:100%;margin-top:13px;min-height:48px}
.how{display:none;margin-top:16px;padding:14px 14px 13px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 82%,var(--card2)));box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
.how-h{color:var(--mut);font:800 12px Manrope,system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase}
.how-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.how-s>div{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font:700 12.5px/1.25 Manrope,system-ui,sans-serif}
.how-s>div:not(:last-child):after{content:"";position:absolute;top:16px;left:calc(50% + 24px);width:calc(100% - 40px);border-top:2px dashed var(--line)}
.how-s i{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px Manrope,system-ui,sans-serif;font-style:normal;color:#fff;background:var(--grad);box-shadow:0 8px 16px -8px #6c5cffcc}
.how-f{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);color:var(--ac);font:700 12.5px Manrope,system-ui,sans-serif;text-align:center}
.how-f svg{flex:none;width:15px;height:15px}
/* ===== Tarix: ko'rsatkichlar, kun sarlavhalari, shisha segment ===== */
.hsum{display:grid;grid-template-columns:.8fr 1.5fr 1.2fr;gap:0;margin-top:16px;padding:15px 6px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 140% at 0% 0%,#2a2470,#161a3d 58%,var(--card));box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
.hsum>div{min-width:0;padding:0 6px;text-align:center}
.hsum>div+div{border-left:1px solid #ffffff1f}
.hsum b{display:block;font:800 15px Manrope,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsum small{display:block;margin-top:4px;color:var(--mut);font-size:11.5px;font-weight:700}
:root[data-theme=light] .hsum{background:linear-gradient(135deg,#e9e6ff,#fff 70%)}
:root[data-theme=light] .hsum>div+div{border-color:var(--line)}
.it .r .st{max-width:118px;line-height:1.25;text-align:center}
.hday{margin:20px 4px 0;color:var(--mut);font:800 12px Manrope,system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase}
.hday+.it{margin-top:8px}
.seg{background:linear-gradient(135deg,#ffffff1c,#ffffff08);border:1px solid #ffffff26;-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 1px 1px #ffffff30,var(--sh)}
.seg button{border:1px solid transparent}
.seg button.on{background:linear-gradient(160deg,#ffffff38,#8b7bff33 55%,#35b8ff26);border-color:#ffffff4a;box-shadow:inset 0 1.5px 1px #ffffffa0,0 8px 18px -8px #6c5cffcc;color:var(--tx)}
:root[data-theme=light] .seg{background:#ffffffb8;border-color:var(--line)}
:root[data-theme=light] .seg button.on{background:linear-gradient(160deg,#6c5cff26,#35b8ff1c);border-color:#6c5cff40;box-shadow:none}
.hf{display:none;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.hf::-webkit-scrollbar{display:none}.hf.on{display:flex}
.hf button{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));box-shadow:inset 0 1px 0 var(--hi);color:var(--mut);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;transition:.2s}
.hf button.on{color:var(--tx);border-color:#ffffff4a;background:linear-gradient(160deg,#ffffff30,#8b7bff33 55%,#35b8ff22);box-shadow:inset 0 1.5px 1px #ffffff80,0 6px 14px -8px #6c5cffcc}
:root[data-theme=light] .hf button.on{border-color:#6c5cff40;background:linear-gradient(160deg,#6c5cff26,#35b8ff1c);box-shadow:none}
.ti.gi{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2)) center/cover;border-color:#ffffff26;font-size:22px}
.ti .sd{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;border:2.5px solid var(--card);background:var(--warn)}
.ti .sd.up{background:var(--ok)}.ti .sd.dn{background:#ff4d6d}
/* Filtr chiplari: siljimaydi, to'rttasi ham bir qatorga sig'adi (juda tor ekranda pastga o'raladi) */
.fl{overflow:visible;flex-wrap:wrap;gap:6px}
.fl button{flex:1 1 auto;padding:10px 8px;font-size:13.5px;white-space:nowrap;text-align:center}
</style>

    for(const r of rs){const p=(r.products||[]).find(x=>Number(x.id)===id);if(p)return{g,r,p}}}

async function reorder(){
  if(rbusy)return;const L=lastBuy(),f=L&&findProd(L.items[0].pid);
  hap();if(!f){nav("shop");return}
  rbusy=true;
  try{
    openGame(f.g);
    const rs=f.g.regions||[];
    if(rs.length>1){const i=rs.indexOf(f.r);if(i>=0)setRegion(i,false)}
    const pi=$("#pid"),zi=$("#zid"),r=reg||game;
    pi.value=L.pid;zi.value=r.needs_zone?L.zid:"";pf=pi.value;resetChk();renderSaved();
    if(f.p.var_kind){upd();return} // summa/miqdor kiritiladigan xizmat: ID tayyor, miqdorni mijoz o'zi kiritadi
    cart={};
    L.items.forEach(it=>{const x=packById[it.pid];if(x&&x.price>0&&cartUnits()+it.n<=CART_MAX)cart[x.id]={p:x,n:it.n}});
    const ks=Object.keys(cart);
    if(!ks.length){upd();return}
    cartChanged(ks[0]);refreshCards();
    if(canChk()&&idOk(pi.value)&&zoneOk())await checkAcc(false);
    if(valid()&&(chkSt==="ok"||!canChk()))choose();
  }finally{rbusy=false}}

const bnBC={};
function bnBlur(src,cb){

  const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{let u="";
    try{const W=36,H=22,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
      x.imageSmoothingQuality="high";

      const d=x.getImageData(0,0,W,H),p=d.data,k=v=>v<0?0:v>255?255:v;
      for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],l=.3*r+.59*g+.11*b;
        p[i]=k((l+(r-l)*1.5)*.85);p[i+1]=k((l+(g-l)*1.5)*.85);p[i+2]=k((l+(b-l)*1.5)*.85)}
      x.putImageData(d,0,0);u=c.toDataURL("image/png")}catch(e){}

/* Silliq o'tish: easeInOut (sekin boshlanib, sekin to'xtaydi). Scroll-snap animatsiya vaqtida o'chiriladi. */
const bnEase=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function bnScroll(x,instant,cb){

  const done=()=>{t.scrollLeft=x;if(cb)cb();t.style.scrollSnapType="";bnBusy=0};
  const from=t.scrollLeft,dx=x-from;

(function(){const t=$("#bn");

      else if(i!==bnI){bnI=i;bnDots();bnSched()}},110)},{passive:true});
  const stop=()=>{bnTouch=1;clearTimeout(bnTm);cancelAnimationFrame(bnAnim);bnBusy=0;t.style.scrollSnapType=""};
  const go=()=>{bnTouch=0;bnSched()};

function grpStatus(it){

  if(S.every(v=>v==="awaiting_payment"))return"awaiting_payment";
  if(["awaiting_payment","paid","processing"].some(has))return"processing";

  return S.every(v=>v==="failed")?"failed":"expired"}
function groupOrders(list){
  const by={},out=[];
  list.forEach(o=>{
    if(!o.group_id){out.push(o);return}
    let g=by[o.group_id];
    if(!g){g=by[o.group_id]={grp:true,id:o.group_id,items:[],amount:0,created_at:o.created_at,player_id:o.player_id,game_name:o.game_name};out.push(g)}
    g.items.push(o);g.amount+=+o.amount||0});
  out.forEach((g,i)=>{if(!g.grp)return;
    if(g.items.length<2){out[i]=g.items[0];return}
    const c={};g.items.slice().reverse().forEach(o=>{const n=ordName(o);c[n]=(c[n]||0)+1});
    g.title=Object.keys(c).map(n=>n+(c[n]>1?" ×"+c[n]:"")).join(" + ");
    g.status=grpStatus(g.items)});
  return out}

  if(qr){const n=qr.length,ms=Math.max(4,Math.floor(250/n)),qs=ms*n,qp=16,cp=26,cardH=qs+2*qp+2*cp,cy=by+bh+30,cx=pad-8,cw=W-2*pad+16;
